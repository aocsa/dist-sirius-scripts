sirius:
  memory:
    host: { capacity_bytes: 180Gi }
    disk: { disk_id: 0, capacity_bytes: 1000000000000, downgrade_root_dirs: "@SPILL_DIR@" }
  executor:
    scan_manager:
      num_threads: 32
      uring_n_reactors: 4
      cache: { mode: none }
      uring: { max_inflight_small_reads: 16, small_read_bytes: 4MiB }
  operator_params:
    max_dynamic_filter_bloom_bytes_per_gpu: 8Gi
    max_build_probe_resident_bytes: 64Gi
    max_build_hash_table_bytes: 64Gi
